[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimorse"
version = "0.1.0"
authors = [{ name = "Hadis Ghodrati", email = "hadis.ghodrati-saeini@physik.tu-chemnitz.de" }]
maintainers = [{ name = "Jeffrey Kelling", email = "jeffrey.kelling@physik.tu-chemnitz.de" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "Symmetry-constrained Fourier–Morse models for anisotropic pair interactions"
readme = "README.md"
requires-python = ">=3.9"

keywords = [
    "anisotropic interactions",
    "Morse potential",
    "Fourier expansion",
    "molecular modeling",
    "scientific computing",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "lmfit",
]


[project.urls]
Homepage = "https://github.com/hadis-gh/chimorse"
Repository = "https://github.com/hadis-gh/chimorse"
Issues = "https://github.com/hadis-gh/chimorse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]